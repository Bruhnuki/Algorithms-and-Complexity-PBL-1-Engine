components:
  schemas:
    CommandIn:
      properties:
        client_seq:
          minimum: 0.0
          title: Client Seq
          type: integer
        payload:
          additionalProperties: true
          title: Payload
          type: object
        type:
          maxLength: 40
          title: Type
          type: string
      required:
      - client_seq
      - type
      title: CommandIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LoginIn:
      properties:
        email:
          maxLength: 254
          title: Email
          type: string
        password:
          maxLength: 200
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    NewRunIn:
      description: 'Experimental branch: Heat modifiers, and the practice sprint used
        by the tutorial.'
      properties:
        heat:
          items:
            type: string
          maxItems: 10
          title: Heat
          type: array
        tutorial:
          default: false
          title: Tutorial
          type: boolean
      title: NewRunIn
      type: object
    RegisterIn:
      properties:
        cohort_code:
          anyOf:
          - maxLength: 24
            type: string
          - type: 'null'
          title: Cohort Code
        display_name:
          maxLength: 80
          minLength: 1
          title: Display Name
          type: string
        email:
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        instructor_code:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Instructor Code
        password:
          maxLength: 200
          title: Password
          type: string
        role:
          default: student
          pattern: ^(student|instructor)$
          title: Role
          type: string
      required:
      - email
      - password
      - display_name
      title: RegisterIn
      type: object
    TickIn:
      properties:
        real_ms:
          maximum: 1000000000.0
          minimum: 0.0
          title: Real Ms
          type: integer
      required:
      - real_ms
      title: TickIn
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: Fix it with Scrum
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
  /api/v1/auth/logout:
    post:
