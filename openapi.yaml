components:
  schemas:
    ChatIn:
      properties:
        text:
          maxLength: 300
          minLength: 1
          title: Text
          type: string
      required:
      - text
      title: ChatIn
      type: object
    CommandIn:
      properties:
        client_seq:
          minimum: 0.0
          title: Client Seq
          type: integer
        payload:
          additionalProperties: true
          title: Payload
          type: object
        type:
          maxLength: 40
          title: Type
          type: string
      required:
      - client_seq
      - type
      title: CommandIn
      type: object
    ControlIn:
      properties:
        action:
          pattern: ^(cancel|pause|resume|speed|apply)$
          title: Action
          type: string
        changes:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Changes
        speed:
          anyOf:
          - maximum: 7200.0
            minimum: 1.0
            type: number
          - type: 'null'
          title: Speed
      required:
      - action
      title: ControlIn
      type: object
    E1In:
      properties:
        advance_to:
          anyOf:
          - enum:
            - STANDUP
            - BUILD
            - REVIEW
            type: string
          - type: 'null'
          title: Advance To
        budget:
          default: 3000
          maximum: 32000.0
          minimum: 50.0
          title: Budget
          type: integer
        mode:
          default: auto
          enum:
          - auto
          - exact
          - greedy
          title: Mode
          type: string
        n:
          default: 120
          maximum: 2000.0
          minimum: 1.0
          title: N
          type: integer
        run_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Run Id
        seed:
          default: 1
          title: Seed
          type: integer
        source:
          default: synthetic
          enum:
          - synthetic
          - run
          title: Source
          type: string
        stage:
          default: BUILD
          enum:
          - PLANNING
          - STANDUP
          - BUILD
          - REVIEW
          title: Stage
          type: string
      title: E1In
      type: object
    E2In:
      properties:
        B:
          default: 1000
          maximum: 10000.0
          minimum: 100.0
          title: B
          type: integer
        mean_post:
          default: 65
          maximum: 100.0
          minimum: 0.0
          title: Mean Post
          type: number
        mean_pre:
          default: 40
          maximum: 100.0
          minimum: 0.0
          title: Mean Pre
          type: number
        n:
          default: 30
          maximum: 2000.0
          minimum: 1.0
          title: N
          type: integer
        run_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Run Id
        seed:
          default: 1
          title: Seed
          type: integer
        source:
          default: synthetic
          enum:
          - synthetic
          - cohort
          title: Source
          type: string
        spread:
          default: 15
          maximum: 50.0
          minimum: 0.0
          title: Spread
          type: number
      title: E2In
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobIn:
      properties:
        kind:
          pattern: ^(live|baseline|stress|optimize|validate)$
          title: Kind
          type: string
        params:
          additionalProperties: true
          title: Params
          type: object
        rate:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 1000.0
            type: number
          - type: 'null'
          title: Rate
        rates:
          anyOf:
          - items:
              type: number
            maxItems: 40
            type: array
          - type: 'null'
          title: Rates
        reps:
          anyOf:
          - maximum: 20.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Reps
        speed:
          anyOf:
          - maximum: 7200.0
            minimum: 1.0
            type: number
          - type: 'null'
          title: Speed
      required:
      - kind
      title: JobIn
      type: object
    LoginIn:
      properties:
        email:
          maxLength: 254
          title: Email
          type: string
        password:
          maxLength: 200
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    NewRunIn:
      description: 'Experimental branch: Heat modifiers, and the practice sprint used
        by the tutorial.'
      properties:
        heat:
          items:
            type: string
          maxItems: 10
          title: Heat
          type: array
        project:
          default: 1
          maximum: 3.0
          minimum: 1.0
          title: Project
          type: integer
        tutorial:
          default: false
          title: Tutorial
          type: boolean
      title: NewRunIn
      type: object
    RegisterIn:
      properties:
        cohort_code:
          anyOf:
          - maxLength: 24
            type: string
          - type: 'null'
          title: Cohort Code
        display_name:
          maxLength: 80
          minLength: 1
          title: Display Name
          type: string
        email:
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        instructor_code:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Instructor Code
        password:
          maxLength: 200
          title: Password
          type: string
        role:
          default: student
          pattern: ^(student|instructor)$
          title: Role
          type: string
      required:
      - email
      - password
      - display_name
      title: RegisterIn
      type: object
    TickIn:
      properties:
        real_ms:
          maximum: 1000000000.0
          minimum: 0.0
          title: Real Ms
          type: integer
      required:
      - real_ms
      title: TickIn
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: Fix it with Scrum
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/ai/status:
    get:
      description: Is the AI helping right now? The game plays the same either way;
        this only reports it.
      operationId: ai_status_api_v1_ai_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ai Status
  /api/v1/algorithm/solve:
    post:
      description: 'The engines'' single entry point (pbl_engine/engine/solve.py):
        `algorithm` is context_chaining or learning_gain.'
      operationId: solve_endpoint_api_v1_algorithm_solve_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Request
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Solve Endpoint
  /api/v1/auth/csrf:
    get:
      description: 'After a page refresh the browser still holds the session cookie
        but has lost the CSRF token: issue a new one for this session.'
      operationId: fresh_csrf_api_v1_auth_csrf_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Fresh Csrf
  /api/v1/auth/login:
    post:
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
  /api/v1/auth/logout:
    post:
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Logout
  /api/v1/auth/register:
    post:
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register
  /api/v1/consent:
    post:
      operationId: consent_api_v1_consent_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Consent
  /api/v1/debug/projects/reset:
    post:
      description: 'Developer shortcut (FIXIT_DEBUG=1): start writing this player''s
        Projects 2 and 3 again, so the progress can be watched.'
      operationId: reset_projects_api_v1_debug_projects_reset_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Reset Projects
  /api/v1/instructor/cohorts/{cohort_id}/runs:
    get:
      operationId: cohort_runs_api_v1_instructor_cohorts__cohort_id__runs_get
      parameters:
      - in: path
        name: cohort_id
        required: true
        schema:
          title: Cohort Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cohort Runs
  /api/v1/instructor/engines/benchmark:
    post:
      description: 'The engines'' own measurements (from pbl_engine/benchmark.py),
        taken here on this machine: DP scaling, policy, bootstrap, accumulator.'
      operationId: benchmark_api_v1_instructor_engines_benchmark_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Benchmark
  /api/v1/instructor/engines/e1:
    post:
      description: Run E1 on a synthetic transcript or on a real run's transcript,
        with the policy you pick, and compare it with the baselines.
      operationId: e1_workbench_api_v1_instructor_engines_e1_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/E1In'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: E1 Workbench
  /api/v1/instructor/engines/e2:
    post:
      description: Learning gain with a bootstrap interval (synthetic cohort, or the
        real cohort's first-to-latest run), and the saturating process score on a
        run's behaviours.
      operationId: e2_workbench_api_v1_instructor_engines_e2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/E2In'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: E2 Workbench
  /api/v1/instructor/engines/feed:
    get:
      operationId: feed_api_v1_instructor_engines_feed_get
      parameters:
      - in: query
        name: since
        required: false
        schema:
          default: 0
          title: Since
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Feed
  /api/v1/instructor/engines/runs:
    get:
      operationId: runs_api_v1_instructor_engines_runs_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Runs
  /api/v1/instructor/runs/{run_id}/transcript:
    get:
      operationId: transcript_api_v1_instructor_runs__run_id__transcript_get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Transcript
  /api/v1/instructor/sim/calibrate:
    post:
      description: Time this deployment's real authentication, interpreter and AI
