        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Control
  /api/v1/instructor/sim/jobs/{job_id}/export.csv:
    get:
      operationId: export_api_v1_instructor_sim_jobs__job_id__export_csv_get
      parameters:
      - in: path
        name: job_id
